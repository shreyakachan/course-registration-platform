{% extends 'base.html' %}

{% block title %}500 Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 p-5">
                <div class="stat-icon bg-danger-subtle text-danger mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
                    <i class="bi bi-exclamation-octagon-fill"></i>
                </div>
                <h1 class="display-6 fw-bold text-navy mb-2">500 - Server Error</h1>
                <p class="text-muted mb-4">
                    An unexpected server error occurred. Our engineering telemetry has logged this event.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door me-1"></i> Return to Safety
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
