{% extends 'base.html' %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 p-5">
                <div class="stat-icon bg-warning-subtle text-warning mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
                    <i class="bi bi-shield-slash-fill"></i>
                </div>
                <h1 class="display-6 fw-bold text-navy mb-2">403 - Access Forbidden</h1>
                <p class="text-muted mb-4">
                    You do not have the required role or authorization to access this administrative resource.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door me-1"></i> Return to Safety
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
